# Brings up Redis and the Rust API for the container smoke test.
# The worker is deliberately absent: this checks the built API image, the queue,
# and the status round trip. Nothing here needs a GPU or an API key.
#
#   docker compose -f docker-compose.test.yml up --build -d
#   python tests/integration/smoke.py
#   docker compose -f docker-compose.test.yml down

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: ./realtime_producer
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
