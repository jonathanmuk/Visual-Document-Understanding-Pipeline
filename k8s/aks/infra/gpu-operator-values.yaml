# k8s/aks/infra/gpu-operator-values.yaml
# Declarative configuration for the NVIDIA GPU Operator on AKS
# Goal: Ensure all managed components (Drivers, Toolkit, Plugin, NFD)
# tolerate the GPU node taints (sku=gpunpa100 and sku=gpunpt4).

nfd:
  enabled: true
  worker:
    tolerations: &gpu_tolerations
      - key: "sku"
        operator: "Equal"
        value: "gpunpa100"
        effect: "NoSchedule"
      - key: "sku"
        operator: "Equal"
        value: "gpunpt4"
        effect: "NoSchedule"

node-feature-discovery:
  worker:
    tolerations: *gpu_tolerations

daemonsets:
  tolerations: *gpu_tolerations

validator:
  tolerations: *gpu_tolerations

gfd:
  enabled: true
  tolerations: *gpu_tolerations

driver:
  enabled: true
toolkit:
  enabled: true

# GPU utilisation metrics for the dashboard. The exporter and its ServiceMonitor
# are on by default in the chart; stated here so nobody has to wonder.
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
