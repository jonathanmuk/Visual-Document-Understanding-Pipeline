# The reaper: puts back tasks whose worker died. Small, always on, CPU pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-reaper-deployment
  labels:
    app: ocr-reaper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-reaper
  template:
    metadata:
      labels:
        app: ocr-reaper
    spec:
      nodeSelector:
        app: api-gateway
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
      containers:
        - name: ocr-reaper
          image: ocr-reaper  # registry set in kustomization.yml
          imagePullPolicy: Always
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-redis-secret
                  key: password
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-reaper-metrics
  labels:
    app: ocr-reaper
spec:
  selector:
    app: ocr-reaper
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  type: ClusterIP
