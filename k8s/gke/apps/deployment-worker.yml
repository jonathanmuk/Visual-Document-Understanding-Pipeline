apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker-rt-deployment
  labels:
    app: ocr-worker-rt
spec:
  replicas: 0 # KEDA scales this on T4 nodes
  selector:
    matchLabels:
      app: ocr-worker-rt
  template:
    metadata:
      labels:
        app: ocr-worker-rt
    spec:
      # No Kubernetes API access is needed, so no service account token is mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-nodepool: gpunpt4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
        - name: tmp
          emptyDir:
            sizeLimit: "2Gi"
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
      containers:
        - name: ocr-worker-rt-python
          image: ocr-worker-rt  # registry set in kustomization.yml
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-redis-secret
                  key: password
          # The worker has no HTTP server for health. It touches a heartbeat file
          # every 5 seconds from its event loop, which keeps running during a long
          # parse. A heartbeat older than a minute means the process is stuck.
          startupProbe:
            exec:
              command: ["sh", "-c", "test -n \"$(find /tmp/worker-heartbeat -mmin -1 2>/dev/null)\""]
            periodSeconds: 10
            failureThreshold: 30   # up to 5 minutes to load the SDK and layout model
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$(find /tmp/worker-heartbeat -mmin -1 2>/dev/null)\""]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: dshm
              mountPath: "/dev/shm"
            - name: tmp
              mountPath: "/tmp"
            - name: model-weights
              mountPath: "/mnt/models"
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-worker-metrics
  labels:
    app: ocr-worker-rt
spec:
  selector:
    app: ocr-worker-rt
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
  type: ClusterIP
