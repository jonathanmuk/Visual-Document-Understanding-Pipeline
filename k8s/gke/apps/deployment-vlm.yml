apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-vlm-deployment
  labels:
    app: ocr-vlm
spec:
  replicas: 1 # Can be scaled by KEDA if needed
  selector:
    matchLabels:
      app: ocr-vlm
  template:
    metadata:
      labels:
        app: ocr-vlm
    spec:
      # No Kubernetes API access is needed, so no service account token is mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-nodepool: gpunpa100
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: ocr-vlm-server
          image: ocr-vlm-qwen  # registry set in kustomization.yml
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: "1" 
              cpu: "16"
              memory: "120Gi"
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "64Gi"
          volumeMounts:
            - name: model-weights
              mountPath: /mnt/models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: model-weights-pvc
        # Compile and kernel caches (HOME is /tmp in the image).
        - name: tmp
          emptyDir:
            sizeLimit: "20Gi"
        # vLLM's processes pass data through shared memory; the default 64Mi is too small.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-vlm-service
  # The ServiceMonitor in observability/ finds this Service by this label.
  # Without it Prometheus never collects vLLM's metrics, and the rule that
  # adds a second A100 when requests are waiting can never fire.
  labels:
    app: ocr-vlm
spec:
  selector:
    app: ocr-vlm
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http   # named so the ServiceMonitor can find /metrics on it
  type: ClusterIP
