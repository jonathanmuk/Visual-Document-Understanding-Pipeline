apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-api-deployment
  labels:
    app: ocr-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-api
  template:
    metadata:
      labels:
        app: ocr-api
    spec:
      nodeSelector:
        app: api-gateway
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
      containers:
        - name: ocr-api-rust
          image: ocr-api-rust  # registry set in kustomization.yml
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-redis-secret
                  key: password
          # /health says the process is up. /ready says Redis answers, which is
          # the only thing the API needs to do its job.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
