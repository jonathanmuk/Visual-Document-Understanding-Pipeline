apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-api-deployment
  labels:
    app: ocr-api
spec:
  replicas: 1 # Lightweight Rust API on Redis node pool
  selector:
    matchLabels:
      app: ocr-api
  template:
    metadata:
      labels:
        app: ocr-api
    spec:
      nodeSelector:
        app: api-gateway
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
      containers:
        - name: ocr-api-rust
          image: ocr-api-rust  # registry set in kustomization.yml
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ocr-pipeline-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
