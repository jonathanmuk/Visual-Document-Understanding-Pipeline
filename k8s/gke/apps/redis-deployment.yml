# Redis: the queue and the state store.
#
# Append-only persistence on a persistent disk, a password from a Secret, and
# probes. The Secret must exist before this is applied:
#
#   kubectl create secret generic ocr-redis-secret \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# Durability posture: this is a durable queue and result cache, not a system of
# record. Results expire (RESULT_TTL_SECONDS). If a document must never be lost,
# it belongs in object storage as well (docs/adr/0005-no-object-storage-yet.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-redis
  labels:
    app: ocr-redis
spec:
  replicas: 1
  # A ReadWriteOnce disk can be attached to one pod at a time, so the old pod
  # must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocr-redis
  template:
    metadata:
      labels:
        app: ocr-redis
    spec:
      automountServiceAccountToken: false
      # The redis image's own user (999) and group (1000). fsGroup makes the disk
      # writable by that group.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        app: redis-store
      tolerations:
        - key: "sku"
          operator: "Equal"
          value: "redis"
          effect: "NoSchedule"
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ocr-redis-secret
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "8Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-redis-service
spec:
  selector:
    app: ocr-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
