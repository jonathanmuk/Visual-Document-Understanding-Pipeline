# KEDA: turns machines on when there is work and off when there is not.
#
# The Redis trigger authenticates through TriggerAuthentication, which reads the
# same Secret the application uses.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ocr-redis-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: password
      name: ocr-redis-secret
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-worker-rt-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-worker-rt-deployment
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    # 1. Warm-start during business hours (NY Time)
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 8 * * 1-5
        end: 0 18 * * 1-5
        desiredReplicas: "1"
    # 2. One worker per waiting task (the worker processes one batch at a time)
    - type: redis
      metadata:
        address: ocr-redis-service.default.svc.cluster.local:6379
        listName: ocr_tasks
        listLength: "1"
      authenticationRef:
        name: ocr-redis-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-vlm-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-vlm-deployment
  minReplicaCount: 0
  maxReplicaCount: 4
  cooldownPeriod: 300
  pollingInterval: 10
  triggers:
    # 1. Warm-start during business hours
    - type: cron
      metadata:
        timezone: America/New_York
        start: 0 8 * * 1-5
        end: 0 18 * * 1-5
        desiredReplicas: "1"
    # 2. Scale from zero: if any document is waiting or in progress, vLLM must
    #    exist. vLLM's own metric cannot do this, because with no vLLM pod there
    #    is nothing to scrape and the metric is simply absent. listLength is set
    #    high so this trigger only ever asks for one replica; the Prometheus
    #    trigger below decides whether more are needed once vLLM is up.
    - type: redis
      metadata:
        address: ocr-redis-service.default.svc.cluster.local:6379
        listName: ocr_tasks
        listLength: "100000"
        activationListLength: "0"
      authenticationRef:
        name: ocr-redis-auth
    - type: redis
      metadata:
        address: ocr-redis-service.default.svc.cluster.local:6379
        listName: ocr_tasks:processing
        listLength: "100000"
        activationListLength: "0"
      authenticationRef:
        name: ocr-redis-auth
    # 3. Scale beyond one when vLLM has requests waiting for a slot.
    #    Requires the ServiceMonitor in observability/ so the metric exists.
    #    The label is "namespace" (what the Prometheus Operator attaches), not
    #    the "kubernetes_namespace" the inherited manifest queried, which never
    #    matched anything. ignoreNullValues treats "no vLLM yet" as zero rather
    #    than an error.
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc:9090
        query: sum(vllm:num_requests_waiting{namespace="default"})
        threshold: "1"
        ignoreNullValues: "true"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ocr-api-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: ocr-api-deployment
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "70"
