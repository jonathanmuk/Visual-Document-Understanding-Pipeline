[project]
name = "vdu-mcp"
version = "0.6.0"
description = "Model Context Protocol server for the Visual Document Understanding Pipeline"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
vdu-mcp = "vdu_mcp.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vdu_mcp*"]
