name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-api:
    name: Rust API tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    defaults:
      run:
        working-directory: realtime_producer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: realtime_producer
      - name: Unit and integration tests
        run: cargo test
        env:
          REDIS_URL: redis://localhost:6379

  python-worker:
    name: Python worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realtime_consumer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [rust-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install redis
      - name: Build and start API + Redis
        run: docker compose -f docker-compose.test.yml up --build -d
      - name: Smoke test the built image
        run: python tests/integration/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down

  manifests:
    name: Kubernetes manifests build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize k8s/aks/ > /dev/null
      - run: kubectl kustomize k8s/gke/ > /dev/null
