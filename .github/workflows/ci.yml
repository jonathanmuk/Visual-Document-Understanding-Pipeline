name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-api:
    name: Rust API tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    defaults:
      run:
        working-directory: realtime_producer
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: realtime_producer
      - name: Unit and integration tests
        run: cargo test
        env:
          REDIS_URL: redis://localhost:6379

  python-worker:
    name: Python worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime_consumer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: realtime_consumer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Tools tests (evaluation scoring, throughput arithmetic)
        run: |
          pip install -r ../tools/requirements.txt
          pytest -q ../tools/tests

  mcp-server:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            mcp_server/requirements.txt
            mcp_server/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [rust-api, mcp-server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install redis mcp
      - name: Build and start Redis, API, reaper, and MCP server
        run: docker compose -f docker-compose.test.yml up --build -d
      - name: Smoke test the built images
        run: python tests/integration/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down

  worker-image:
    name: Worker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The worker image is large (CUDA base). Building it proves the Dockerfile
      # and its pinned dependencies still resolve; it is not run here.
      - run: docker build -t ocr-worker-rt:ci ./realtime_consumer
      - run: docker run --rm --entrypoint python3 ocr-worker-rt:ci -c "import worker, vdu_queue, vdu_metrics, vdu_inspect, vdu_profiles, glmocr; print('worker imports OK')"
      - name: Runs as an unprivileged user
        run: test "$(docker run --rm --entrypoint id ocr-worker-rt:ci -u)" = "10001"

  manifests:
    name: Kubernetes manifests build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - run: kubectl kustomize k8s/aks/ > /dev/null
      - run: kubectl kustomize k8s/gke/ > /dev/null
      - name: Both clouds render the same objects
        run: |
          diff <(kubectl kustomize k8s/aks/ | grep -E '^kind:|^  name:') <(kubectl kustomize k8s/gke/ | grep -E '^kind:|^  name:')
      - name: Every object matches its schema, custom resources included
        # Custom resources (KEDA, Prometheus Operator) are checked against the
        # community CRD schema catalog.
        run: |
          for c in aks gke; do
            kubectl kustomize k8s/$c/ > rendered-$c.yaml
            docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest               -strict -summary               -schema-location default               -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'               /work/rendered-$c.yaml
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every reference between objects resolves
        # A ServiceMonitor that selects no Service, or a NetworkPolicy that
        # protects no pod, is valid on its own and silently useless.
        run: |
          pip install pyyaml
          for c in aks gke; do
            kubectl kustomize k8s/$c/ | python tests/manifests/check_references.py
          done

  dependency-audit:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust (RustSec advisory database)
        working-directory: realtime_producer
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python (PyPI advisory data via pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r realtime_consumer/requirements-dev.txt
          pip-audit -r mcp_server/requirements.txt
          pip-audit -r tools/requirements.txt
