[package]
name = "ocr-producer-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.6", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.4", features = ["limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4"] }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.10"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
# Text format only; the default protobuf feature pulls in a crate with a known
# advisory (RUSTSEC-2024-0437) and is not needed to serve /metrics.
prometheus = { version = "0.13", default-features = false }
once_cell = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
# Only body::to_bytes is used. "full" would enable HTTP/2 and pull in h2.
hyper = "0.14"
